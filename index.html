<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F171D">
<title>مترجم جلسه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F171D;--ink:#E6EDF1;--muted:#93A4B0;--line:#26343E;--card:#17222A;
  --me:#1F9A93;--me-soft:#123332;--them:#C98A45;--live:#FF6B5B;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:1.05rem;margin:0;font-weight:800}
.hb{display:flex;gap:6px}
.hb button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem}
#status{padding:0 16px 6px;color:var(--muted);font-size:.85rem;min-height:1.4em}
#log{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;margin:auto;max-width:30ch;line-height:1.9}
.msg{background:var(--card);border-radius:14px;padding:10px 14px;border-inline-start:5px solid var(--line)}
.msg.me{border-inline-start-color:var(--me)} .msg.them{border-inline-start-color:var(--them)}
.src{color:var(--muted);font-size:.85rem;line-height:1.7}
.out{font-size:1.25rem;line-height:1.75;margin-top:4px}
[dir=ltr].out,[dir=ltr].src{font-family:"Source Serif 4",Georgia,serif}
.msg.them .out{font-weight:600}
.interim{opacity:.6;font-style:italic}
.row{margin-top:6px}
.row button{background:var(--me-soft);color:var(--me);border:0;border-radius:8px;padding:5px 12px;font:inherit;font-size:.85rem}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 14px;border-top:1px solid var(--line)}
.big{border:0;border-radius:18px;padding:16px 8px;font:inherit;font-weight:800;font-size:1.15rem;line-height:1.4;color:#fff;min-height:100px}
.big small{display:block;font-weight:400;font-size:.8rem;opacity:.9}
#btnMe{background:var(--me)} #btnThem{background:var(--them)}
.big.on{outline:4px solid var(--live);outline-offset:2px;animation:p 1.2s infinite}
@keyframes p{50%{outline-color:transparent}}
.typebar{grid-column:1/-1;display:flex;gap:8px}
.typebar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px 10px;font:inherit;background:var(--card);color:var(--ink)}
.typebar button{border:0;border-radius:10px;padding:0 14px;font:inherit;background:var(--ink);color:var(--bg)}
#settings{position:fixed;inset:0;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;display:none;z-index:5}
#settings.open{display:block}
#settings label{display:block;margin:14px 0 6px;font-weight:600}
#settings input,#settings textarea,#settings select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--card);color:var(--ink)}
#settings textarea{min-height:220px;direction:ltr;font-size:.85rem}
#settings p{color:var(--muted);font-size:.85rem;line-height:1.8;margin:4px 0}
.sb{display:flex;gap:8px;margin-top:18px}
.sb button{flex:1;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600}
#save{background:var(--me);color:#fff} #close{background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--me);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>مترجم جلسه</h1>
  <div class="hb"><button id="clear">پاک کردن</button><button id="openSet">تنظیمات</button></div>
</header>
<div id="status"></div>
<div id="log"><p class="empty" id="empty">دکمهٔ سبز: شما فارسی بگویید، انگلیسی بلند پخش می‌شود.<br>دکمهٔ قهوه‌ای: طرف مقابل انگلیسی بگوید، فارسی فقط نوشته می‌شود.</p></div>
<div class="controls">
  <button class="big" id="btnMe">من — فارسی<small>پخش صدای انگلیسی</small></button>
  <button class="big" id="btnThem">طرف مقابل — English<small>فقط متن فارسی</small></button>
  <div class="typebar"><input id="typed" placeholder="یا تایپ کنید (فارسی یا انگلیسی)"><button id="send">ترجمه</button></div>
</div>

<div id="settings">
  <h2 style="margin:0">تنظیمات</h2>
  <label for="key">کلید API (Anthropic)</label>
  <input id="key" type="password" dir="ltr" placeholder="sk-ant-...">
  <p>فقط روی همین گوشی ذخیره می‌شود.</p>
  <label for="rate">سرعت صدای انگلیسی</label>
  <select id="rate"><option value="0.85">آهسته</option><option value="0.95" selected>معمولی</option><option value="1.05">تند</option></select>
  <label for="ctx">اطلاعات کار (نام‌ها و اصطلاحات)</label>
  <textarea id="ctx"></textarea>
  <p>هر نام یا اصطلاح جدید را اینجا اضافه کنید تا درست ترجمه شود.</p>
  <div class="sb"><button id="save">ذخیره</button><button id="close">بستن</button></div>
</div>

<script>
const MODEL = 'claude-haiku-4-5-20251001';
const DEFAULT_CTX = `Speaker: Mehdi Hemmati, sole director of Capital Better Home Inc. (CBH), a construction / real estate company in Ottawa (Stittsville). Electrical engineer and builder.
Usual other party: his litigation lawyer Steven Chnaris (SCPC Law, Ottawa).
Litigation: Hemmati / CBH v. former partners Saeideh Shabani (شعبانی) and Khorami (خرمی); their lawyer Zak Tatomirovic-Manula (ZTM Law).
Properties: 481 Wentworth, 479 Wentworth, 465 Mutual.
Lenders: Graysbrook Capital (mortgage 2922), Oppono (first mortgage on 481 Wentworth).
Accountant: Ayat Tadjalli / Tajalli (تجلی), QualiVests. Insurance: HUB International.
Terms: دادخواست = statement of claim; لایحه = submission / brief; سوگندنامه = affidavit; برداشت = withdrawal; آورده = capital contribution; وام مسکن / مورگیج = mortgage; مالیات بر ارزش افزوده / HST = HST; اداره مالیات = CRA; گزارش فارنزیک = forensic report; سهامدار = shareholder; مدیر = director.`;
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const store={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lastFinal='',buf='',flushT=null;
function flush(){const t=buf.trim();buf='';lastFinal='';clearInterim();if(t)translate(mode||'me',t);}
let rec=null,mode=null,wantOn=false,speaking=false,interimEl=null;
const hist=[];
const log=$('log');
function setStatus(t){$('status').textContent=t}

function init(){
  $('key').value=store.get('key','');
  $('ctx').value=store.get('ctx',DEFAULT_CTX);
  $('rate').value=store.get('rate','0.95');
  if(!store.get('key','')){ setStatus('اول در «تنظیمات» کلید API را وارد کنید.'); openSet(); }
  else setStatus(SR?'آماده.':'تشخیص گفتار نیست؛ صفحه را در Chrome باز کنید.');
  if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
}
function openSet(){$('settings').classList.add('open')}
$('openSet').onclick=openSet;
$('close').onclick=()=>$('settings').classList.remove('open');
$('save').onclick=()=>{store.set('key',$('key').value.trim());store.set('ctx',$('ctx').value);store.set('rate',$('rate').value);
  $('settings').classList.remove('open');setStatus('ذخیره شد. آماده.');};

function addMsg(kind,src){
  $('empty')?.remove();
  const d=document.createElement('div');d.className='msg '+kind;
  const s=document.createElement('div');s.className='src';s.dir=kind==='me'?'rtl':'ltr';s.textContent=src;
  const o=document.createElement('div');o.className='out';o.dir=kind==='me'?'ltr':'rtl';o.textContent='…';
  d.append(s,o);log.append(d);log.scrollTop=log.scrollHeight;return{d,o};
}

async function translate(kind,text){
  text=text.trim();if(!text)return;
  const key=store.get('key','');
  const {d,o}=addMsg(kind,text);
  if(!key){o.textContent='کلید API وارد نشده.';return;}
  const recent=hist.slice(-6).map(h=>(h.k==='me'?'Mehdi: ':'Other side: ')+h.en).join('\n');
  const task=kind==='me'
    ?`Translate Mehdi's Persian speech into natural, clear spoken English, first person, as he would say it to the other person. The text came from speech recognition and may have errors; infer the intended meaning using the context. Output ONLY the English translation.`
    :`Translate the other person's English speech into clear, natural Persian (Farsi) for Mehdi to read. The text came from speech recognition and may have errors; infer the intended meaning. Keep names and legal/financial terms accurate; for an important legal term add the English in parentheses once. Output ONLY the Persian translation.`;
  const prompt=`You are a live meeting interpreter.\nWork context:\n${store.get('ctx',DEFAULT_CTX)}\n${recent?'\nRecent conversation (English):\n'+recent+'\n':''}\n${task}\n\nText:\n${text}`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL,max_tokens:800,system:'You are a translation engine inside a live interpreter app. Output ONLY the translation of the given text. Never ask questions, never comment, never explain, never refuse. If the text is short, partial or unclear, translate it as best you can anyway.',messages:[{role:'user',content:prompt}]})});
    const j=await r.json();
    if(!r.ok){o.textContent='خطا: '+(j.error?.message||r.status);return;}
    const out=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    o.textContent=out;
    hist.push({k:kind,en:kind==='me'?out:text});
    if(kind==='me'){
      const row=document.createElement('div');row.className='row';
      const b=document.createElement('button');b.textContent='پخش دوباره';b.onclick=()=>speak(out);
      row.append(b);d.append(row);speak(out);
    }
  }catch(e){o.textContent='خطای اینترنت. دوباره بگویید.';}
  log.scrollTop=log.scrollHeight;
}

function speak(text){
  if(!('speechSynthesis' in window)){setStatus('پخش صدا در این مرورگر نیست.');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=parseFloat(store.get('rate','0.95'));
  const v=speechSynthesis.getVoices().find(v=>/^en[-_](US|CA)/i.test(v.lang));if(v)u.voice=v;
  speaking=true;
  if(rec&&mode==='me'){try{rec.abort()}catch(e){}}
  u.onend=u.onerror=()=>{speaking=false;if(wantOn&&mode==='me')startRec();};
  speechSynthesis.speak(u);
}

function startRec(){
  rec=new SR();rec.lang=mode==='me'?'fa-IR':'en-US';rec.continuous=false;rec.interimResults=true;
  rec.onresult=ev=>{let interim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];
      if(r.isFinal){const t=r[0].transcript.trim();if(t&&t!==lastFinal){lastFinal=t;buf+=(buf?' ':'')+t;showInterim(buf);clearTimeout(flushT);flushT=setTimeout(flush,1600);}}else interim+=r[0].transcript;}
    if(interim)showInterim((buf?buf+' ':'')+interim);if(interim)clearTimeout(flushT);};
  rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){setStatus('اجازهٔ میکروفون داده نشد.');stopAll();}};
  rec.onend=()=>{if(wantOn&&!speaking){try{startRec()}catch(e){}}};
  try{rec.start()}catch(e){}
}
function showInterim(t){$('empty')?.remove();
  if(!interimEl){interimEl=document.createElement('div');interimEl.className='msg interim '+mode;log.append(interimEl);}
  interimEl.dir=mode==='me'?'rtl':'ltr';interimEl.textContent=t;log.scrollTop=log.scrollHeight;}
function clearInterim(){interimEl?.remove();interimEl=null}
function stopAll(){clearTimeout(flushT);if(buf.trim()){const m=mode,t=buf.trim();buf='';clearInterim();translate(m,t);}wantOn=false;try{rec&&rec.stop()}catch(e){}rec=null;clearInterim();
  $('btnMe').classList.remove('on');$('btnThem').classList.remove('on');mode=null;}
function toggle(w){
  if(!SR){setStatus('تشخیص گفتار نیست؛ صفحه را در Chrome باز کنید.');return;}
  const was=mode;stopAll();if(was===w){setStatus('متوقف شد.');return;}
  mode=w;wantOn=true;$(w==='me'?'btnMe':'btnThem').classList.add('on');
  setStatus(w==='me'?'گوش می‌دهم (فارسی)… برای توقف دوباره بزنید.':'Listening (English)… برای توقف دوباره بزنید.');
  startRec();
}
$('btnMe').onclick=()=>{window.speechSynthesis?.getVoices();toggle('me')};
$('btnThem').onclick=()=>toggle('them');
$('send').onclick=()=>{const t=$('typed').value.trim();if(!t)return;$('typed').value='';
  translate(/[\u0600-\u06FF]/.test(t)?'me':'them',t);};
$('typed').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});
$('clear').onclick=()=>{log.innerHTML='';hist.length=0};
init();
</script>
</body>
</html>
